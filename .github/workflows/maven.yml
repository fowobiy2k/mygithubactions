name: Java CI with Maven
'on':
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Build And Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v4
        with:
          image: tostos/mygithubaction
          registry: docker.io
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'
      - name: Debug SSH Keyscan
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -v -T 10 -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: SSH and deploy Docker container
        run: |
          ssh -i ~/.ssh/id_rsa ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            echo "Stopping container..."
            sudo docker stop springboot-container || true

            echo "Removing container..."
            sudo docker rm springboot-container || true

            echo "Removing image..."
            sudo docker rmi my-springboot-app || true

            echo "Pulling new image (optional)..."
            # sudo docker pull tostos/mygithubaction:latest

            echo "Running new container..."
            sudo docker run -d --name mygithubaction -p 80:8080 tostos/mygithubaction:latest
          EOF
